name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Windows only, deliberately: the launchers are .bat, the app runs under
    # pythonw, and the writer lock is designed around Windows' os.kill semantics.
    # Testing elsewhere would prove something other than what ships.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Syntax gate
        run: python -m compileall -q orderflow tools tests

      - name: Tests
        # Each suite runs in its own process with a throwaway ORDERFLOW_DATA;
        # see tests/_runner.py.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Headless render still works
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m orderflow.app --replay --symbol ASII --shot smoke.png
          if (-not (Test-Path smoke.png)) { throw "no PNG produced" }
        shell: pwsh
